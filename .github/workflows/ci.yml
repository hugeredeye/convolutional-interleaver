name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: '1.9' 

    - name: Install Dependencies
      run: julia -e 'using Pkg; Pkg.instantiate()'

    - name: Run Tests
      run: julia tests.jl
